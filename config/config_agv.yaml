agv_radar_pcl_processor:
  ros__parameters:
    imu_topic: "/arco/idmind_imu/imu"       # IMU topic
    radar_topic: "/arco/radar/PointCloudDetection" # Radar topic
    holonomic_vehicle: true            # Holonomic ground Vehicle (true/false)
    ground_vehicle: true # this is used to apply the motion constraints in holonomic case
    use_accel_consistency_gate: true
    imu_accel_has_gravity: true
    accel_lpf_alpha: 0.25
    accel_consistency_gain: 3.0
    accel_consistency_bias: 0.25
    accel_max_norm: 6.0
    accel_gate_dt_min: 0.02
    accel_gate_dt_max: 0.30
    use_velocity_sanity_gate: true
    max_speed_norm: 5.0
    max_speed_x: 2.5
    max_speed_y: 2.5
    max_speed_z: 0.5
    imu_to_base_link: [0.0, 0.0, 0.165, 0.0, 0.0, 0.0] # x y z r p y 
    radar_to_base_link: [0.45, 0.05, 0.5, 0.0, 0.0, 0.0]  

    #Channel number of intensity and doppler channel
    intensity_channel: 2
    doppler_channel: 0
    enable_dynamic_object_removal: true # Remove dynamic objects

    #Distance filter thresholds
    distance_near_thresh: 0.5
    distance_far_thresh: 100.0
    z_low_thresh: -10.0
    z_high_thresh: 100.0

    #Ego velocity estimator thresholds/params
    min_dist: 0.5
    max_dist: 100.0
    min_db: -5.0 #RCS
    elevation_thresh_deg: 15.0
    azimuth_thresh_deg: 55.0
    doppler_velocity_correction_factor: 1.0
    thresh_zero_velocity: 0.015
    allowed_outlier_percentage: 0.15
    sigma_zero_velocity_x: 1.0e-03
    sigma_zero_velocity_y: 3.2e-03
    sigma_zero_velocity_z: 1.0e-02
    sigma_offset_radar_x: 0.0
    sigma_offset_radar_y: 0.0
    sigma_offset_radar_z: 0.0
    max_sigma_x: 0.2
    max_sigma_y: 0.2
    max_sigma_z: 0.2
    max_r_cond: 0.2
    use_cholesky_instead_of_bdcsvd: true
    use_ransac: true
    outlier_prob: 0.30
    success_prob: 0.995
    N_ransac_points: 10.0
    inlier_thresh: 0.10
    min_inlier_ratio: 0.75
    min_inlier_count: 20.0
    ransac_mad_scale: 1.8
    
agv_optimizer:
  ros__parameters:
    bias_rpy: [0.0, 0.0, 0.0]   #IMU orientation bias in rads

    #Keyframe Thresholds
    keyframe_delta_trans: 1.0
    keyframe_delta_angle: 0.3

    #Optimization window size
    max_window_size: 5
